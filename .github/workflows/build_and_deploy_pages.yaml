name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # CAMBIO IMPORTANTE: Los repos nuevos usan 'main', no 'master'
  workflow_dispatch:

# Permite que solo corra un deploy a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20 # Fijamos la versión 20 para evitar problemas con .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 'npm ci' es más rápido y seguro para entornos automáticos que 'npm install'

      - name: Build Project
        run: npm run build
        # Esto ejecuta webpack (genera dist/*.content.js) y luego copy-script.js,
        # que copia esos archivos a public/ para que index.html los cargue con fetch().

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Evita el error "Multiple artifacts named github-pages were unexpectedly
      # found" cuando se reintenta ("re-run") un job dentro del mismo run: borra
      # cualquier artifact "github-pages" que haya quedado de un intento anterior.
      - name: Delete stale artifact (if retrying this run)
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public' # Correcto: Subimos la carpeta public que ya tiene content.js copiado

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
