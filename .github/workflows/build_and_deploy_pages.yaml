name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # CAMBIO IMPORTANTE: Los repos nuevos usan 'main', no 'master'
  workflow_dispatch:

# Permite que solo corra un deploy a la vez
concurrency:
  group: 'pages'
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20 # Fijamos la versión 20 para evitar problemas con .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 'npm ci' es más rápido y seguro para entornos automáticos que 'npm install'

      - name: Build Project
        run: npm run build
        # Esto ejecuta webpack (genera dist/*.content.js) y luego copy-script.js,
        # que copia esos archivos a public/ para que index.html los cargue con fetch().

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Evita el error "Multiple artifacts named github-pages were unexpectedly
      # found" cuando se reintenta ("re-run") un job dentro del mismo run: borra
      # cualquier artifact "github-pages" que haya quedado de un intento anterior.
      - name: Delete stale artifact (if retrying this run)
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public' # Correcto: Subimos la carpeta public que ya tiene content.js copiado

      # GitHub Pages a veces devuelve "Deployment failed, try again later." de forma
      # transitoria (fallo intermitente del backend de Pages, ver
      # https://github.com/actions/deploy-pages/issues/406). El artifact ya está
      # subido correctamente, así que reintentamos el propio paso de deploy con
      # backoff en vez de fallar el workflow en el primer intento.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry 1
        if: steps.deployment1.outcome == 'failure'
        run: |
          echo "Primer intento de deploy falló (probable fallo transitorio de GitHub Pages). Reintentando en 30s..."
          sleep 30

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retry 2
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: |
          echo "Segundo intento de deploy falló. Reintentando en 60s..."
          sleep 60

      - name: Deploy to GitHub Pages (attempt 3)
        id: deployment3
        if: steps.deployment1.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Set deployment output
        id: deployment
        if: always()
        run: |
          URL="${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment1.outputs.page_url }}"
          echo "page_url=$URL" >> "$GITHUB_OUTPUT"
